<svg width="100%" viewBox="0 0 1100 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#0a0616"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101627" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f1c" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="dgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#161d33" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1100" height="660" rx="18" fill="url(#dbg)"/>
  <rect width="1100" height="660" rx="18" fill="url(#dgrid)"/>
  <text x="40" y="46" font-family="'JetBrains Mono',monospace" font-size="16" fill="#22d3ee" letter-spacing="3">// PROFILE_DASHBOARD</text>
  <line x1="40" y1="58" x2="1060" y2="58" stroke="#1e2947"/>

  <!-- card generation macro via repeated groups -->
  <!-- Row 1 -->
  <g font-family="'JetBrains Mono',monospace">

    <!-- Card template repeated manually -->
    <!-- 1: Role -->
    <g transform="translate(40,80)">
      <rect width="330" height="150" rx="14" fill="url(#cardFill)" stroke="url(#cardEdge)" stroke-width="1.4"/>
      <circle cx="26" cy="30" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <path d="M18 30h16M26 22v16" stroke="#60a5fa" stroke-width="2"/>
      <text x="46" y="35" font-size="12" fill="#64748b" letter-spacing="2">ROLE</text>
      <text x="20" y="75" font-size="20" fill="#e2e8f0" font-weight="700">Associate Software</text>
      <text x="20" y="98" font-size="20" fill="#e2e8f0" font-weight="700">Developer</text>
      <text x="20" y="128" font-size="12" fill="#475569">Backend · Integrations</text>
    </g>

    <!-- 2: Company -->
    <g transform="translate(390,80)">
      <rect width="330" height="150" rx="14" fill="url(#cardFill)" stroke="url(#cardEdge)" stroke-width="1.4"/>
      <rect x="16" y="20" width="20" height="20" rx="4" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="46" y="35" font-size="12" fill="#64748b" letter-spacing="2">COMPANY</text>
      <text x="20" y="75" font-size="20" fill="#e2e8f0" font-weight="700">Cyntexa Labs</text>
      <text x="20" y="98" font-size="20" fill="#e2e8f0" font-weight="700">Pvt. Ltd.</text>
      <text x="20" y="128" font-size="12" fill="#475569">MuleSoft · Salesforce ISV Partner</text>
    </g>

    <!-- 3: Location -->
    <g transform="translate(740,80)">
      <rect width="320" height="150" rx="14" fill="url(#cardFill)" stroke="url(#cardEdge)" stroke-width="1.4"/>
      <circle cx="26" cy="28" r="9" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="26" cy="28" r="3" fill="#22d3ee"/>
      <text x="46" y="35" font-size="12" fill="#64748b" letter-spacing="2">LOCATION</text>
      <text x="20" y="75" font-size="20" fill="#e2e8f0" font-weight="700">Jaipur,</text>
      <text x="20" y="98" font-size="20" fill="#e2e8f0" font-weight="700">Rajasthan, India</text>
      <text x="20" y="128" font-size="12" fill="#475569">IST · UTC+5:30</text>
    </g>

    <!-- Row 2 -->
    <!-- 4: Current Focus -->
    <g transform="translate(40,250)">
      <rect width="330" height="150" rx="14" fill="url(#cardFill)" stroke="url(#cardEdge)" stroke-width="1.4"/>
      <path d="M20 26 L32 26 L26 40 Z" fill="#f59e0b"/>
      <text x="46" y="35" font-size="12" fill="#64748b" letter-spacing="2">CURRENT FOCUS</text>
      <text x="20" y="75" font-size="17" fill="#e2e8f0" font-weight="700">Promotion Reconciliation</text>
      <text x="20" y="98" font-size="17" fill="#e2e8f0" font-weight="700">API — Mule 4</text>
      <text x="20" y="128" font-size="12" fill="#475569">DataWeave · SKU-level refund logic</text>
    </g>

    <!-- 5: Experience -->
    <g transform="translate(390,250)">
      <rect width="330" height="150" rx="14" fill="url(#cardFill)" stroke="url(#cardEdge)" stroke-width="1.4"/>
      <path d="M16 32 L26 20 L36 32" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <text x="46" y="35" font-size="12" fill="#64748b" letter-spacing="2">EXPERIENCE</text>
      <text x="20" y="80" font-size="30" fill="#e2e8f0" font-weight="700">2026 — Present</text>
      <text x="20" y="128" font-size="12" fill="#475569">MuleSoft &amp; Salesforce Integration Dev</text>
    </g>

    <!-- 6: Open to Work -->
    <g transform="translate(740,250)">
      <rect width="320" height="150" rx="14" fill="url(#cardFill)" stroke="#22c55e" stroke-width="1.4" opacity="0.95"/>
      <circle cx="26" cy="28" r="6" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="46" y="35" font-size="12" fill="#64748b" letter-spacing="2">STATUS</text>
      <text x="20" y="75" font-size="20" fill="#4ade80" font-weight="700">Open to Work</text>
      <text x="20" y="98" font-size="14" fill="#94a3b8">MuleSoft/Salesforce Dev</text>
      <text x="20" y="122" font-size="14" fill="#94a3b8">Jr. DevOps · Quant/HFT</text>
    </g>

  </g>

  <!-- Tech stack strip -->
  <text x="40" y="450" font-family="'JetBrains Mono',monospace" font-size="14" fill="#a78bfa" letter-spacing="2">// CORE_STACK</text>
  <g font-family="'JetBrains Mono',monospace" font-size="13" fill="#cbd5e1">
    <g transform="translate(40,470)">
      <rect width="1020" height="150" rx="14" fill="url(#cardFill)" stroke="#1e2947" stroke-width="1.2"/>
      <text x="24" y="34" fill="#64748b" font-size="11" letter-spacing="2">PROGRAMMING</text>
      <text x="24" y="56">Java · JavaScript · C++ · Apex · SOQL · SQL · Bash</text>
      <text x="24" y="80" fill="#64748b" font-size="11" letter-spacing="2">INTEGRATION / BACKEND</text>
      <text x="24" y="102">MuleSoft (Mule 4, DataWeave 2.0, RAML, MUnit) · Node.js · Express · REST APIs</text>
      <text x="530" y="34" fill="#64748b" font-size="11" letter-spacing="2">SALESFORCE</text>
      <text x="530" y="56">Apex · LWC · Flows · Batch/Queueable Apex · Platform Events</text>
      <text x="530" y="80" fill="#64748b" font-size="11" letter-spacing="2">DEVOPS / CLOUD</text>
      <text x="530" y="102">Linux (RHCSA) · Docker · Kubernetes · Terraform · AWS · GitHub Actions</text>
      <text x="24" y="130" fill="#64748b" font-size="11" letter-spacing="2">CURRENTLY LEARNING → Microservices · Redis · Kafka · System Design · AI Engineering</text>
    </g>
  </g>
</svg>
