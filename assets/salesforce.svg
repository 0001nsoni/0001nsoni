      <stop offset="100%" stop-color="#0a0e18" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="sfgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#141b30" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1100" height="560" rx="18" fill="url(#sfbg)"/>
  <rect width="1100" height="560" rx="18" fill="url(#sfgrid)"/>

  <!-- cloud glyph -->
  <g transform="translate(40,30)">
