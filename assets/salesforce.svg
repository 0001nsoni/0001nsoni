  </g>
  <text x="90" y="46" font-family="'JetBrains Mono',monospace" font-size="16" fill="#00A1E0" letter-spacing="3">// SALESFORCE_PLATFORM.exe</text>
  <line x1="40" y1="60" x2="1060" y2="60" stroke="#1e2947"/>

