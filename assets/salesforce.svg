  <g transform="translate(40,360)"><rect width="245" height="120" rx="12" fill="url(#sfFill)" stroke="url(#sfEdge)" stroke-width="1.2"/><text x="16" y="30" font-size="13" fill="#64748b" letter-spacing="2">09</text><text x="16" y="58" font-size="19" fill="#e2e8f0" font-weight="700">Validation Rules</text><text x="16" y="82" font-size="11" fill="#475569">Data integrity at</text><text x="16" y="98" font-size="11" fill="#475569">the platform layer</text></g>

