      <stop offset="0%" stop-color="#050810"/><stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="sfEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A1E0" stop-opacity="0.7"/>
